name: Unit Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "system_files/**"
      - "tests/**"
      - "scripts/**"
      - "Justfile"
      - ".github/workflows/unit-tests.yml"
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Homebrew environment and test dependencies
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "$(/home/linuxbrew/.linuxbrew/bin/brew --prefix)/bin" >> "$GITHUB_PATH"
          brew install bats-core fish zsh
          pip install pytest pytest-cov pyyaml jsonschema numpy

      - name: Install just
        uses: taiki-e/install-action@d03c2ed96f683e9e174ccb288ecb4b6489ee22e1 # just
        with:
          tool: just

      - name: shellcheck — extensionless scripts (derived from shebangs)
        run: |
          # Derive the extensionless set from shebangs instead of a hardcoded
          # path list. .sh/.py/.fish are covered elsewhere; this targets only
          # extensionless shell scripts (bash/sh, NOT zsh). The first line is
          # read with the `read` builtin (not command substitution) so binary
          # files in system_files (images, udev rules) never trip bash. The
          # `|| true` keeps read's non-zero exit (EOF without a trailing
          # newline, as every binary file has) from aborting the step under
          # the runner's `bash -e` errexit. Match the interpreter word, not just
          # a trailing `*/sh`, so `#!/bin/sh -e` and `#!/usr/bin/env sh` are
          # caught too — a trailing-only match would silently skip them and
          # defeat the derivation. Scripts are already `! -name '*.sh'`.
          scripts=()
          while IFS= read -r -d '' f; do
            IFS= read -r first < "$f" || true
            case "$first" in
              '#!'*) case "$first" in *bash*|*/sh|*/sh\ *|*env\ sh*) scripts+=("$f") ;; esac ;;
            esac
          done < <(find system_files -type f ! -name '*.sh' ! -name '*.py' ! -name '*.fish' ! -path '*pixmaps/*' -print0)
          if [ "${#scripts[@]}" -gt 0 ]; then
            shellcheck "${scripts[@]}"
          fi

      - name: shellcheck — .sh scripts
        run: find system_files -name '*.sh' -print0 | xargs -0 shellcheck -e SC1091

      - name: shellcheck the Brewfile validator
        run: shellcheck scripts/validate-brewfiles.sh tests/test_validate_brewfiles.bats

      - name: Run bats (all suites, catalog derived from disk)
        run: |
          # Derive the bats catalog from disk: every tests/*.bats runs. This
          # replaces the old per-suite list that had silently drifted — suites
          # were on disk but never ran in CI.
          bats tests/*.bats

      - name: Run pytest (all modules, catalog derived from disk)
        run: python3 -m pytest tests/test_*.py -v --cov=system_files/bluefin/etc/bazaar --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:coverage-html --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage-html/
          retention-days: 7


      - name: Smoke-test brew bundle accepts preinstall Brewfile (real Homebrew)
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew bundle list --file=system_files/shared/usr/share/ublue-os/homebrew/preinstall.d/system-cli.Brewfile
