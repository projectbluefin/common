name: Promotion Candidate E2E

# Common cannot add a full installer gate for downstream repos by itself, but it
# can continuously exercise the exact testing-stream tags that feed promotion.
on:
  schedule:
    - cron: "0 3 * * 2"
  workflow_dispatch:

permissions: {}

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Bluefin Testing
            image: ghcr.io/projectbluefin/bluefin:testing
            suites: smoke,common
          - name: Bluefin LTS Testing
            image: ghcr.io/projectbluefin/bluefin:lts-testing
            suites: smoke,common
    name: "E2E — ${{ matrix.name }}"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/run-testsuite.yml
    with:
      image: ${{ matrix.image }}
      suites: ${{ matrix.suites }}

  notify-on-failure:
    name: "File issue on E2E failure"
    needs: [e2e]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out trusted issue policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: File promotion-blocker issue
        id: incident
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DATE=$(date +'%Y-%m-%d')
          issue_url=$(gh issue create \
            --repo "$REPO" \
            --title "ci: promotion candidate E2E failed — ${DATE}" \
            --body "<!-- report-type: bug -->
          The Tuesday promotion-candidate E2E suite failed before the promotion window. **Do NOT promote** the affected testing images until resolved. Workflow run: ${RUN_URL}

          ## Maintainer
          - Open the failed suite and logs at ${RUN_URL}.
          - Identify the regression owner and agree on the fix scope.
          - Require a passing candidate run before promotion.

          ## Reporter
          **Reporter action:** None unless additional evidence is requested.")
          printf 'issue-number=%s\n' "${issue_url##*/}" >> "$GITHUB_OUTPUT"
      - name: Reconcile the recorded promotion incident
        id: policy
        uses: projectbluefin/actions/issue-lifecycle@v1
        with:
          apply: 'true'
          issue: ${{ steps.incident.outputs.issue-number }}
      - name: Preserve migration snapshot
        if: always() && steps.policy.outputs.backup-directory != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: common-candidate-intake-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.policy.outputs.backup-directory }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30
