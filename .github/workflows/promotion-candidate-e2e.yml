name: Promotion Candidate E2E

# Common cannot add a full installer gate for downstream repos by itself, but it
# can continuously exercise the exact testing-stream tags that feed promotion.
on:
  schedule:
    - cron: "0 3 * * 2"
  workflow_dispatch:

permissions: {}

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Bluefin Testing
            image: ghcr.io/projectbluefin/bluefin:testing
            suites: smoke,common
          - name: Bluefin LTS Testing
            image: ghcr.io/projectbluefin/bluefin:lts-testing
            suites: smoke,common
    name: "E2E — ${{ matrix.name }}"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/run-testsuite.yml
    with:
      image: ${{ matrix.image }}
      suites: ${{ matrix.suites }}

  notify-on-failure:
    name: "File issue on E2E failure"
    needs: [e2e]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out trusted issue policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: File promotion-blocker issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DATE=$(date +'%Y-%m-%d')
          issue_url=$(gh issue create \
            --repo "$REPO" \
            --title "ci: promotion candidate E2E failed — ${DATE}" \
            --body "<!-- report-type: bug -->
          The Tuesday promotion-candidate E2E suite failed before the promotion window. **Do NOT promote** the affected testing images until resolved. Workflow run: ${RUN_URL}

          Next actor: maintainer. Inspect the failed suite, identify the regression owner, and require a passing candidate run before promotion. Reporter action: none unless additional evidence is requested.")
          python3 scripts/common_issue_policy.py --repo "$REPO" --issue "${issue_url##*/}" --apply
      - name: Preserve migration snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: common-candidate-intake-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ~/.local/state/common-issue-policy/*.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30
