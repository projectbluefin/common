name: Common issue lifecycle

on:
  issues:
    types: [opened, reopened, edited, labeled, unlabeled, assigned, unassigned, closed]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled, unlabeled, closed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reviewed preview (false reads only)
        type: boolean
        default: false
      issue:
        description: Optional issue or PR number; empty previews the repository
        type: string
        default: ''
      labels-only:
        description: Repair labels without comments, mentions, or closure
        type: boolean
        default: false
      migrate:
        description: Quiet full-history alias and retired-label migration
        type: boolean
        default: false
      retire:
        description: Retire definitions after migration and supported-client cutover
        type: boolean
        default: false
      confirm-client-cutover:
        description: Confirm supported callers no longer write retired labels
        type: boolean
        default: false

permissions: {}

jobs:
  reconcile:
    if: github.repository == 'projectbluefin/common'
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    uses: projectbluefin/actions/.github/workflows/reusable-issue-lifecycle.yml@v1
    with:
      apply: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
      issue: ${{ inputs.issue || '' }}
      labels-only: ${{ github.event_name == 'schedule' || inputs['labels-only'] || false }}
      migrate: ${{ inputs.migrate || false }}
      retire: ${{ inputs.retire || false }}
      confirm-client-cutover: ${{ inputs['confirm-client-cutover'] || false }}
