name: Run Testsuite

# Reusable wrapper around projectbluefin/testsuite e2e.yml.
# Keeps the testsuite SHA pin in one place for PR, post-merge, and
# promotion-candidate gates in this repo.
on:
  workflow_call:
    inputs:
      image:
        description: "Full image ref to test"
        required: true
        type: string
      suites:
        description: "Comma-separated test suites to run"
        required: true
        type: string

permissions: {}

jobs:
  e2e:
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@7da50e5b6f165a4704159b0ce5a4898caff6466a # main
    permissions:
      contents: read
      packages: write
    with:
      image: ${{ inputs.image }}
      suites: ${{ inputs.suites }}
