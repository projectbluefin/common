name: Run Testsuite

# Reusable wrapper around projectbluefin/testsuite e2e.yml.
# Keeps the testsuite SHA pin in one place for PR, post-merge, and
# promotion-candidate gates in this repo.
on:
  workflow_call:
    inputs:
      image:
        description: "Full image ref to test"
        required: true
        type: string
      suites:
        description: "Comma-separated test suites to run"
        required: true
        type: string
      test_ref:
        description: "Git ref for testsuite checkout (default: v1)"
        required: false
        type: string
        default: "v1"

permissions: {}

jobs:
  e2e:
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@171ae3df98622f7b17906ca8b69535606e09b1d9 # v1
    permissions:
      contents: read
      packages: write
    with:
      image: ${{ inputs.image }}
      suites: ${{ inputs.suites }}
      test_ref: ${{ inputs.test_ref }}
