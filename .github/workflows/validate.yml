name: Validate PR

on:
  pull_request:
    branches:
      - main
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate PR title (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|chore|docs|style|refactor|perf|test|ci|build|revert)(\(.+\))?(!)?: .+'
          if ! echo "$PR_TITLE" | grep -qE "$pattern"; then
            echo "ERROR: PR title does not follow Conventional Commits."
            echo "  Got:      $PR_TITLE"
            echo "  Expected: <type>[optional scope]: <description>"
            echo "  Types:    feat fix chore docs style refactor perf test ci build revert"
            echo "  Example:  fix(ci): prevent workflow from running twice"
            exit 1
          fi
          echo "✓ PR title OK: $PR_TITLE"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true


      - name: Check submodule drift
        shell: bash
        run: |
          if git submodule status | grep -E '^[+-]'; then
            echo ""
            echo "ERROR: A submodule is dirty (+) or uninitialized (-)."
            echo "Ensure all submodules are committed at a clean ref."
            exit 1
          fi
          echo "All submodules are clean."

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check Just syntax
        shell: bash
        run: just check

      - name: Install shellcheck
        shell: bash
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck

      - name: Shellcheck .sh scripts
        shell: bash
        run: find system_files -name '*.sh' -print0 | xargs -0 shellcheck -e SC1091,SC2207

      - name: shellcheck — extensionless scripts (derived from shebangs)
        shell: bash
        run: |
          # Derive the extensionless set from shebangs instead of a hardcoded
          # path list. .sh/.py/.fish are covered elsewhere; this targets only
          # extensionless shell scripts (bash/sh, NOT zsh). The first line is
          # read with the `read` builtin (not command substitution) so binary
          # files in system_files (images, udev rules) never trip bash. The
          # `|| true` keeps read's non-zero exit (EOF without a trailing
          # newline, as every binary file has) from aborting the step under
          # the runner's `bash -e` errexit. Match the interpreter word, not just
          # a trailing `*/sh`, so `#!/bin/sh -e` and `#!/usr/bin/env sh` are
          # caught too — a trailing-only match would silently skip them and
          # defeat the derivation. Scripts are already `! -name '*.sh'`.
          scripts=()
          while IFS= read -r -d '' f; do
            IFS= read -r first < "$f" || true
            case "$first" in
              '#!'*) case "$first" in *bash*|*/sh|*/sh\ *|*env\ sh*) scripts+=("$f") ;; esac ;;
            esac
          done < <(find system_files -type f ! -name '*.sh' ! -name '*.py' ! -name '*.fish' ! -path '*pixmaps/*' -print0)
          if [ "${#scripts[@]}" -gt 0 ]; then
            shellcheck "${scripts[@]}"
          fi

      - name: Guard against ublue-os→projectbluefin image ref regressions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check-oci-refs.py

      - name: Check printer-app version contract
        shell: bash
        run: python scripts/check-printer-app-versions.py

      - name: Validate dconf lock/override parity
        shell: bash
        run: |
          echo "Checking dconf lock/override parity..."
          LOCK_FILE="system_files/bluefin/etc/dconf/db/distro.d/locks/01-bluefin-locked-settings"
          OVERRIDE_DIR="system_files/bluefin/usr/share/glib-2.0/schemas"

          if [[ ! -f "$LOCK_FILE" ]]; then
            echo "Lock file not found: $LOCK_FILE"
            exit 1
          fi

          MISSING=0
          while IFS= read -r lock_entry; do
            # Skip empty lines and comments
            [[ -z "$lock_entry" || "$lock_entry" == \#* ]] && continue

            # Extract the key name from the dconf path (last path component)
            key=$(basename "$lock_entry")

            # Check if key appears in any override file
            if ! grep -r "$key" "$OVERRIDE_DIR" --include="*.override" -q 2>/dev/null; then
              echo "MISSING: lock entry '$lock_entry' has no corresponding override in $OVERRIDE_DIR"
              MISSING=$((MISSING + 1))
            fi
          done < "$LOCK_FILE"

          if [[ $MISSING -gt 0 ]]; then
            echo ""
            echo "ERROR: $MISSING locked key(s) have no matching override entry."
            echo "Every key in $LOCK_FILE must have a corresponding entry in a .gschema.override file."
            echo "See docs/skills/dconf-consistency.md for details."
            exit 1
          fi
          echo "All locked keys have matching override entries."

      - name: Install pre-commit
        shell: bash
        run: pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-${{ runner.arch }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pre-commit-

      - name: Run pre-commit
        shell: bash
        run: pre-commit run --all-files
