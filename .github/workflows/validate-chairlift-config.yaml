name: Validate ChairLift Config

# Networked drift gate for /usr/share/chairlift/config.yml. It validates
# against the schema of the ChairLift release the ublue-os/tap cask ships:
# tests/check-chairlift-config reads the cask's `version` at run time, so
# common carries no ChairLift version pin and never tracks upstream main.
#
# This is deliberately NOT part of `just check`: that gate must stay
# hermetic, and a third-party outage must never redden unrelated PRs or the
# merge queue. The weekly cron is what catches upstream drift between
# commits.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "system_files/shared/usr/share/chairlift/config.yml"
      - "tests/check-chairlift-config"
      - ".github/workflows/validate-chairlift-config.yaml"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install deps
        run: pip install pyyaml

      - name: Validate ChairLift config against upstream schema
        run: python3 tests/check-chairlift-config
