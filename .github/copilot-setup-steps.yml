name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install just
        uses: taiki-e/install-action@53aaa72a1fed2d5b9189d6d54c38e29bf9be2ab9 # just
        with:
          tool: just

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Verify tooling
        run: |
          just --version
          pre-commit --version
