# Password strength policy for the initial-setup account page.
#
# GNOME Initial Setup and bootc-installer (both used by Bluefin and Utah) drive
# the "weak password" indicator straight off libpwquality, which reads this file.
# This image shipped with no /etc/pwquality.conf, so the installer fell back to
# the base image's defaults — and the dictionary check there is the documented
# cause of issue #1281: a maximally complex password (upper, lower, digit and
# symbol) still never turned the indicator green, because libpwquality rejected
# it on a dictionary/wordlist match (or a missing wordlist erroring the check).
#
# The dictionary check is the one requirement a user cannot satisfy by "trying
# harder", so it is disabled. The remaining gates (length and character-class
# count) are satisfiable by any genuinely complex password, which is what makes
# the indicator turn green for the password the user actually types.
#
# See pwquality.conf(5) for every key.

# Minimum number of characters.
minlen = 8

# Minimum number of distinct character classes (lower, upper, digit, symbol).
# 3 keeps the bar reachable for a normal complex password; 4 would require all
# classes and is what a user reported never turning the indicator green.
minclass = 3

# Do not fail a password for containing a dictionary word or for a missing
# cracklib wordlist — this is the gate that kept #1281's complex passwords red.
dictcheck = 0

# Reject obvious repetition (aaaa) and monotonic sequences (1234, abcd),
# which no real password needs.
maxrepeat = 3
maxsequence = 3
