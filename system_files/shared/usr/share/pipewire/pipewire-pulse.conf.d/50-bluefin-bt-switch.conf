# Audio device auto-switching (opt-in)
#
# This drop-in used to force-load module-switch-on-connect, which made
# PipeWire auto-select whatever device connected last as the default audio
# output. On every boot (and on device connect) that overrode the output the
# user had explicitly selected in GNOME Settings, so the selection was not
# kept after a reboot. The A2DP-vs-HFP/HSP preference it helped enable is
# handled natively by WirePlumber's Bluetooth policy, so auto-loading this
# module is no longer required.
#
# To restore the previous "auto-switch to newly connected devices" behavior,
# uncomment the block below and restart the user session (or pipewire-pulse):
#
# pulse.cmd = [
#   { cmd = "load-module" args = "module-switch-on-connect" }
# ]
