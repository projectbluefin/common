# Quirk: Kingcome Integrated_Webcam_FHD (USB ID 2b7e:55c0)
#
# Hardware background:
# Many Dell laptops (e.g. Dell XPS 13 DX13260, Inspiron, Latitude) use a dual-sensor
# camera package from Kingcome (vendor: 0x2b7e, product: 0x55c0).
# The device exposes multiple USB interfaces on the same physical camera module:
#   - Interface 0 (node suffix: _1.0): 1080p RGB color webcam (V4L2 /dev/video0)
#   - Interface 2 (node suffix: _1.2): 360x360 greyscale infrared (IR) sensor (V4L2 /dev/video2)
#
# Problem:
# Both interfaces expose identical human-readable descriptions ("Integrated_Webcam_FHD (V4L2)").
# Desktop applications (browsers, Zoom, Discord, Teams) enumerating video devices
# often latch onto the IR interface or display two identical options, resulting in
# an unexpected low-resolution, high-contrast black-and-white night-vision feed.
#
# Fix:
# Disable the IR camera capture node in WirePlumber so desktop applications only
# see and bind to the primary 1080p RGB sensor. Facial recognition tools (e.g. Howdy)
# that directly access /dev/video2 via V4L2 remain unaffected.

monitor.v4l2.rules = [
  {
    matches = [
      {
        device.vendor.id = "0x2b7e"
        device.product.id = "0x55c0"
        node.name = "~v4l2_input.*_1.2"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
