# Prepend Bluefin custom thumbnailer data directory so ffmpeg-thumbnailer
# takes precedence over /usr/share/thumbnailers/gst-video-thumbnailer.thumbnailer.
# GNOME Desktop loads thumbnailers in XDG_DATA_DIRS order; the first registered
# thumbnailer for each MIME type wins.
XDG_DATA_DIRS=/usr/share/ublue-os/thumbnailer:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}
