# NVIDIA suspend quirk (common#803 — "Sleep failing on nvidia system").
#
# Symptom: sleep starts, then the machine wakes itself 2-5 seconds later.
# The driver vetoes system power management outright — nv_pmops_suspend()
# returns NV_ERR_NOT_SUPPORTED (-EIO) with "System Power Management attempted
# without driver procfs suspend interface" — when PreserveVideoMemoryAllocations
# is active but neither the /proc/driver/nvidia/suspend handshake (driven by
# nvidia-suspend.service, which images built on negativo17/.run payloads no
# longer ship) nor kernel suspend notifiers are available. systemd-suspend then
# aborts and the system comes straight back up.
#
# Kernel suspend notifiers are the interface for images without the systemd
# units; the option only became a driver default in 615.71.09, so pin it for
# every driver generation here. Drivers that predate the option ignore the
# unknown parameter, and the options are inert when the nvidia module is
# absent, so this file is safe in the shared layer (system_files/nvidia/ still
# reaches no image — common#1124 — so the quirk cannot live there).
#
# zz- prefix: sorts after the driver packages' nvidia.conf so these assignments
# win if a package also sets them (last assignment in modprobe.d wins).
options nvidia NVreg_UseKernelSuspendNotifiers=1

# The default VRAM save path is /tmp, which is tmpfs: paging a full GPU's
# video memory into RAM can fail during the freeze and abort suspend through
# the notifier the same way. Park the save file on real disk.
options nvidia NVreg_TemporaryFilePath=/var/tmp
